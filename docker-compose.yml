version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chastushki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chastushki}
      POSTGRES_DB: ${POSTGRES_DB:-chastushki}
    volumes:
      - chastushki_db:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chastushki} -d ${POSTGRES_DB:-chastushki}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.13-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: bash -lc "pip install -e '.[dev]' && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chastushki}:${POSTGRES_PASSWORD:-chastushki}@db:5432/${POSTGRES_DB:-chastushki}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3000}"
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  chastushki_db: